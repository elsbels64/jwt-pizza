name: CI Pipeline

on:
  workflow_dispatch:  # manual trigger
  schedule:
    - cron: '0 0 * * 0' #Every Sunday at midnight     

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > public/version.json

      - name: Build
        run: npm ci && npm run build

      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/

      - name: Run unit tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:coverage

      - name: Update coverage
        run: |
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          color=$(echo "$coverage < 80" | bc | awk '{if ($1) print "red"; else print "green"}')
          curl -s -X POST "https://pizza-factory.cs329.click/api/badge/${{ secrets.NET_ID }}/jwtpizzacoverage?label=Coverage&value=$coverage%25&color=$color" \
            -H "authorization: bearer ${{ secrets.FACTORY_API_KEY }}"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build  # only runs if build + unit tests pass
    services:
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: tempdbpassword
          MYSQL_DATABASE: pizza
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -ptempdbpassword"
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: elsbels64/jwt-pizza-service  # ← update this
          path: jwt-pizza-service

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: jwt-pizza-service

      - name: Write backend config
        run: |
          echo "module.exports = {
            jwtSecret: '${{ secrets.JWT_SECRET }}',
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'tempdbpassword',
                database: 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: '${{ secrets.FACTORY_API_KEY }}',
            },
          };" > jwt-pizza-service/src/config.js

      - name: Start backend server
        run: npm start &
        working-directory: jwt-pizza-service
        env:
          PORT: 3000

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run integration tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.integration.config.js
        env:
          VITE_PIZZA_SERVICE_URL: http://localhost:3000  # ← points frontend at local backend
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: playwright-report/
          retention-days: 7